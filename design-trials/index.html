<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pooja Store Trial Images</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #140b0c;
      color: #fff7ed;
    }
    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }
    p {
      margin: 0 0 28px;
      color: #fed7aa;
    }
    .hero {
      margin-bottom: 28px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      background: #2a1212;
    }
    .hero img {
      display: block;
      width: 100%;
      height: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }
    .card {
      background: #2a1212;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      overflow: hidden;
    }
    .card img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 5;
      object-fit: cover;
    }
    .label {
      padding: 14px 16px 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 12px;
      color: #fdba74;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Pooja Store Trial Images</h1>
    <p>These are review-only concepts outside the frontend. If you approve them, I will then connect them to the website.</p>

    <div class="hero">
      <img src="./hero-trial.svg" alt="Hero trial" />
      <div class="label">Hero Background</div>
    </div>

    <div class="grid">
      <div class="card">
        <img src="./category-puja-items.svg" alt="Puja items trial" />
        <div class="label">Puja Items</div>
      </div>
      <div class="card">
        <img src="./category-idols-frames.svg" alt="Idols and frames trial" />
        <div class="label">Idols and Frames</div>
      </div>
      <div class="card">
        <img src="./category-incense-oils.svg" alt="Incense and oils trial" />
        <div class="label">Incense and Oils</div>
      </div>
      <div class="card">
        <img src="./category-festival-supplies.svg" alt="Festival supplies trial" />
        <div class="label">Festival Supplies</div>
      </div>
      <div class="card">
        <img src="./category-brassware.svg" alt="Brassware trial" />
        <div class="label">Brassware</div>
      </div>
    </div>
  </div>
</body>
</html>
