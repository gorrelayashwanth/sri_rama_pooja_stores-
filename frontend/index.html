<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a2b1a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sri Rama Pooja Store</title>
    <!-- Leaflet Map Assets -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  </head>
  <body>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML = "<div style='color:red; padding: 20px; font-family: monospace;'><h1>RUNTIME ERROR</h1><p>" + message + "</p><pre>" + (error && error.stack ? error.stack : '') + "</pre></div>";
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = "<div style='color:red; padding: 20px; font-family: monospace;'><h1>PROMISE REJECTION</h1><p>" + event.reason + "</p><pre>" + (event.reason && event.reason.stack ? event.reason.stack : '') + "</pre></div>";
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
